name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Package HACS integration
        run: git archive --format=zip --output="$RUNNER_TEMP/ingress.zip" HEAD:custom_components/ingress
      - name: Upload package without changing release status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/ingress.zip" --clobber
