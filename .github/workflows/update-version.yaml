name: Verify release version

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify immutable release matches manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('custom_components/ingress/manifest.json').read_text())['version']
          assert version == os.environ['RELEASE_TAG'].removeprefix('v'), (version, os.environ['RELEASE_TAG'])
          PY
