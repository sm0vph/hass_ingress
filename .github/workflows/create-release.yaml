name: Release New Version (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.6.0b2 or 1.6.0'
        required: true
      prerelease:
        description: 'Mark as a test prerelease'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Set release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from packaging.version import Version

          version = os.environ['INPUT_VERSION'].removeprefix('v')
          parsed = Version(version)
          assert str(parsed) == version, 'Use a canonical version such as 1.6.0b2'
          assert not parsed.is_prerelease or os.environ['PRERELEASE'] == 'true'
          path = Path('custom_components/ingress/manifest.json')
          manifest = json.loads(path.read_text())
          assert parsed > Version(manifest['version']), 'Version must increase'
          manifest['version'] = version
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\n')
          PY
      - run: python -m pytest
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/ingress/manifest.json
          git commit -m "chore: release $RELEASE_VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          ARGS=()
          if [ "$PRERELEASE" = 'true' ]; then
            ARGS+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" --target "$(git rev-parse HEAD)" --generate-notes "${ARGS[@]}"
